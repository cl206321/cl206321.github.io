<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 align="center">Cadastro de Funcionários</h1>
    <hr>

    <form>

        <fieldset>
            <legend>Dados Pessoais</legend>
            <!--NOME-->
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" size="40" 
            maxlength="35" minlength="5" required placeholder="Digite seu nome completo sem abreviações">

            <br><br>
            <!--IDADE-->
            <label for="idade">Idade:</label><br>
            <input type="number" name="idade" id="idade" min="18" max="50"><br>
            <small>(Min 18)</small>

            <br><br>
            <!--SEXO-->
            <label for="Sexo">Sexo:</label><br>
            <input type="radio" name="Sexo" id="" value="F"> F
            <input type="radio" name="Sexo" id="" value="M" checked> M

            <br><br>
            <!--DATA DE NASCIMENTO-->
            <label for="nascimento">Data de nascimento:</label>
            <br>
            <input type="date" name="nascimento" id="nascimento" required>

            <br><br>
            <!--ARQUIVO-->
            <label for="foto">Foto:</label>
            <br>
            <input type="file" name="foto" id="foto" accept=".html , .css , .pdf">

            <br><br>
            <!--LOGIN-->
            <label for="login">Login</label>
            <br>
            <input type="text" name="login" id="login" size="15" maxlength="10" required disabled>

            <br><br>
            <!--SENHA-->
            <label for="">Senha</label>
            <br>
            <input type="password" name="Senha" id="Senha" size="15" minlength="3" maxlength="10" required>

        </fieldset>
        
        <fieldset>
            <legend><b><small>Dados profissionais</small></b></legend>

            <label for="cargo">Cargo</label>
            <br>
            <input type="text" name="cargo" id="cargo" value="Professor(a)" readonly>

            <br><br>

            <label for="Periodo">Periodo de Trabalho:</label>
            <input type="checkbox" name="" id="Manhã"> Manhã
            <input type="checkbox" name="" id="Tarde"> Tarde
            <input type="checkbox" name="" id="Noite" checked> Noite

            <br><br>

            <label for="cor">Cor do Uniforme:</label><br>
            <input type="color" name="cor" id="cor">

            <br><br>
            <label for="Capacidade">Quanto você se sente preparado para esta função</label><br>

            0 <input type="range" name="Capacidade" id="Capacidade" min="0" max="10" value="10"> 10

            <br><br>
        <label for="Capacidade">Curso:</label>
        <select>
        <option ></option> <!--PLACEHOLDER-->
        <option >Agrimensura</option>
        <option >Des. Sistemas</option>
        <option >Enfermagem</option>
        <option >Mecânica</option>
        <option >Qualidade</option>
        <option >Administração</option>
        <option >Edificações</option>
        <option >Prot. Dentária</option>

        </select>

        <br><br>
        <label for="disciplinas">Disciplina Favorita: </label>
        <br>
        <select id="disciplinas" name="disciplinas" size="6" multiple>
        <option >Banco de Dados</option>
        <option >Fundamentos de informática</option>
        <option >Lógica de Programação</option>
        <option >DAW</option>
        <option >Projeto Integrador</option>
        <option >Linguagem Multiplataforma</option>
        </select>
        <br>
        <small><i>Para selocionar várias opções utilize ctrl+click</i></small>
        <br><br>

        <label for="formacao">Formação</label>
        <select id="formacao" name="formacao">

            <optgroup label="Graduação">
        <option>Engenharia</option>
        <option >Biológicas</option>
        <option >Exatas</option>
        <option >Humanas</option>
        <option >Tecnologia</option>
            </optgroup>
            <optgroup label="Pós-Graduação">
                <option >Mestrado</option>
                <option >Doutorado</option>
                <option >Pós-Doc</option>
            </optgroup>
        </select>
        <label for="conhecimento">Conhecimento</label>
        <input type="text" id="conhecimento" name="conhecimento"
               list="lista-conhecimentos">

            <datalist id="lista-conhecimento">
                <option value="HTML5">HTML5</option>
                <option value="C#">C#</C></option>
                <option value="CSS3">CSS3</option>
                <option value="PHP">JavaScript</option>
                <option value="JAVA">JAVA</option>

            </datalist>

        </fieldset>

        <fieldset>
            <Legend><b>Datas</b></Legend>

            <label for="dtCad">Data e Hora do Cadastro</label>
            <input type="text" name="" id="">
        </fieldset>

        <fieldset>
        <legend><b>Contato</b></legend>
        <label for="mensagem">Mensagem</label>
        <br>
        <textarea name="mensagem" id="mensagem" rows="4" cols="50">


        </textarea>

        <br><br>
        <label for="email">E-mail</label>
        <br>
        <input type="email" name="email" id="email" required>

        <br><br>

        <label for="url">Site</label>
        <input type="url" name="url" id="url" required>
        </fieldset>

        <br><br>
        <input type="submit" name="btn1" value="Cadastrar">
        <input type="reset" name="btn2" value="Limpar">
        <input type="button" name="btn3" value="Clique aqui" onclick="alert('Olá, 👋 seja bem-vindo!')">
        
    </form>
</body>
</html>
